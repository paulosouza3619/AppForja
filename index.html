const trErr=e=>{const t=String((e&&e.message)||e||''),m=t.toLowerCase();return /invalid login|invalid_credentials/.test(m)?'E-mail ou senha incorretos.':/not confirmed|email_not_confirmed/.test(m)?'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).':/already registered|user_already_exists/.test(m)?'Este e-mail já tem conta. Use Entrar.':/rate limit|over_.*rate/.test(m)?'Muitas tentativas. Aguarde alguns minutos.':/app_data/.test(m)&&/find|exist/.test(m)?'A tabela do app ainda não existe no Supabase. Rode o SQL do guia.':/password/.test(m)&&/(short|least|weak)/.test(m)?'Senha fraca ou curta demais (mínimo 6 caracteres).':/failed to fetch|network|load failed/.test(m)?'Sem conexão com o servidor.':'Erro: '+t};
async function tok(){const a=cl.auth;if(!a)return null;if(a.expires_at-Math.floor(Date.now()/1000)>60)return a.access_token;
const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:a.refresh_token})});
if(!r.ok){if(r.status>=400&&r.status<500){cl.auth=null;cl.user=null;try{localStorage.removeItem('disc_auth')}catch(e){}}return null}setAuth(await r.json());return cl.auth.access_token}
async function sbFetch(path,o={}){const h=Object.assign({apikey:SK,'Content-Type':'application/json'},o.h||{});if(o.auth){const t=await tok();if(!t)throw new Error('Sessão expirada. Entre novamente.');h.Authorization='Bearer '+t}
return fetch(SB+path,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined})}
async function doAuth(){if(cl.busy)return;const em=($('#a_em').value||'').trim(),pw=($('#a_pw')||{}).value||'',m=cl.mode;cl.email=em;
if(!em)return setMsg('Digite seu e-mail.');
if(m!='recover'){if(pw.length<6)return setMsg('A senha precisa ter pelo menos 6 caracteres.');if(m=='signup'&&pw!==$('#a_pw2').value)return setMsg('As senhas não conferem.')}
cl.busy=1;setMsg(m=='signup'?'Criando sua conta…':m=='recover'?'Enviando o link…':'Entrando…',1);try{
if(m=='recover'){const r=await sbFetch('/auth/v1/recover',{m:'POST',b:{email:em}});if(!r.ok)throw new Error(await errTxt(r));cl.busy=0;return setMsg('Se este e-mail tiver conta, enviamos um link para redefinir a senha.',1)}
if(m=='signup'){const r=await sbFetch('/auth/v1/signup',{m:'POST',b:{email:em,password:pw}});if(!r.ok)throw new Error(await errTxt(r));const j=await r.json();cl.busy=0;if(j.access_token){setAuth(j);return afterLogin()}cl.mode='login';return setMsg('Conta criada! Confirme seu e-mail (caixa de entrada e spam) e depois entre.',1)}
const r=await sbFetch('/auth/v1/token?grant_type=password',{m:'POST',b:{email:em,password:pw}});if(!r.ok)throw new Error(await errTxt(r));setAuth(await r.json());cl.busy=0;await afterLogin()
}catch(e){cl.busy=0;setMsg(trErr(e))}}
async function doNewPw(){const p=($('#a_pw').value||'');if(p.length<6)return setMsg('A senha precisa ter pelo menos 6 caracteres.');if(p!==$('#a_pw2').value)return setMsg('As senhas não conferem.');
try{const r=await fetch(SB+'/auth/v1/user',{method:'PUT',headers:{apikey:SK,'Content-Type':'application/json',Authorization:'Bearer '+cl.rec},body:JSON.stringify({password:p})});if(!r.ok)throw new Error(await errTxt(r));cl.rec=null;cl.mode='login';try{history.replaceState(null,'',location.pathname)}catch(e){}setMsg('Senha alterada! Entre com a nova senha.',1)}catch(e){setMsg(trErr(e))}}
async function afterLogin(){cl.skip=false;try{localStorage.removeItem('disc_skip')}catch(e){}cl.msg='';R();await cloudSync('login');R();if(cl.st=='err')toast('Sincronização: '+cl.err)}
function applyRemote(rem){S=Object.assign(DS(),rem);lastXP=null;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
async function cloudSync(mode){try{cl.st='sync';ind('Sincronizando…','busy',0);const r=await sbFetch('/rest/v1/app_data?select=data,updated_at&user_id=eq.'+cl.user.id,{auth:1});if(!r.ok)throw new Error(await errTxt(r));
const rows=await r.json(),rem=rows&&rows[0]&&rows[0].data,has=Object.values(S.d).some(a=>a.length);
if(!rem){if(has||mode=='login')await cloudPush();else{cl.st='ok';ind('Sincronizado','ok',1800)}cl.last=Date.now();return false}
const ru=+rem.ut||0,lu=+S.ut||0;
if(mode=='login'&&has&&ru!==lu){cl.conf={rem};cl.st='idle';ind('Aguardando sua escolha','busy',2500);return false}
let ch=false;if(ru>lu){applyRemote(rem);ch=true}else if(lu>ru)await cloudPush();
if(cl.st!='err'){cl.st='ok';cl.last=Date.now();ind('Sincronizado','ok',1800)}else ind('Erro ao sincronizar: '+cl.err+' · toque para tentar de novo','err',0,cSync);return ch}catch(e){cl.st='err';cl.err=trErr(e);ind('Erro ao sincronizar: '+cl.err+' · toque para tentar de novo','err',0,cSync);return false}}
function cloudSoon(){if(!CLOUD||!cl.user||cl.conf)return;clearTimeout(cpT);cl.st='pend';cpT=setTimeout(cloudPush,2500)}
async function cloudPush(){clearTimeout(cpT);if(!cl.user)return;cl.st='sync';try{const r=await sbFetch('/rest/v1/app_data?on_conflict=user_id',{m:'POST',auth:1,h:{Prefer:'resolution=merge-duplicates,return=minimal'},b:{user_id:cl.user.id,data:S,updated_at:new Date().toISOString()}});if(!r.ok)throw new Error(await errTxt(r));cl.st='ok';cl.err='';cl.last=Date.now();ind('Sincronizado','ok',1800)}catch(e){cl.st='err';cl.err=trErr(e);ind('Erro ao sincronizar: '+cl.err+' · toque para tentar de novo','err',0,cSync)}const el=$('#cst');if(el)el.textContent=cstat()}
async function cres(w){const rem=cl.conf&&cl.conf.rem;cl.conf=null;if(w=='cloud'&&rem)applyRemote(rem);else{sv();await cloudPush()}cl.last=Date.now();R()}
async function cSync(){await cloudSync('start');R();if(cl.st=='err')toast('Falha: '+cl.err);else toast('Sincronizado.',1)}
async function doLogout(){cl.lo=0;await cloudPush();if(cl.st=='err'){toast('Não consegui salvar na nuvem agora. Faça um backup antes de sair.');return R()}
try{const t=cl.auth&&cl.auth.access_token;if(t)await fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+t}})}catch(e){}
cl.auth=null;cl.user=null;cl.conf=null;cl.st='idle';try{localStorage.removeItem('disc_auth');localStorage.removeItem(K)}catch(e){}S=DS();lastXP=null;tab='hoje';R()}
const cstat=()=>cl.st=='sync'?'Sincronizando…':cl.st=='err'?'Erro: '+cl.err:cl.st=='pend'?'Alterações pendentes…':cl.last?'Sincronizado às '+new Date(cl.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Aguardando';
const accCard=()=>!CLOUD?`<div class="cd"><h3>${ic('shield')} Conta e sincronização</h3><small>Disponível no APK ou na versão hospedada. Esta página não se conecta ao servidor.</small></div>`:cl.user?`<div class="cd"><h3>${ic('shield')} Conta</h3><small>${E(cl.user.email)}</small><br><small id="cst">${cstat()}</small><div class="ch"><button class="b s" onclick="cSync()">Sincronizar agora</button><button class="b s" style="background:var(--mu)" onclick="cl.lo=1;R()">Sair</button></div>${cl.lo?`<div class="cd" style="border-color:var(--rd);margin:8px 0 0"><small>Sair apaga os dados deste aparelho. Eles continuam salvos na sua conta.</small><div class="ch"><button class="b s" style="background:var(--rd)" onclick="doLogout()">Sair mesmo</button><button class="b s" style="background:var(--mu)" onclick="cl.lo=0;R()">Cancelar</button></div></div>`:''}</div>`:`<div class="cd"><h3>${ic('shield')} Conta</h3><small>Entre para guardar seus dados na nuvem e usar em outros aparelhos.</small><button class="b" style="margin-top:8px" onclick="cl.skip=false;try{localStorage.removeItem('disc_skip')}catch(e){};R()">Entrar ou criar conta</button></div>`;

#app-shell .priority:first-of-type{border-top:0}
#app-shell .priority .p-icon{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
#app-shell .priority .p-copy{flex:1;min-width:0}
#app-shell .priority strong{display:block}
#app-shell .priority small{color:var(--mu)}
#app-shell .check-btn{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
#app-shell .check-btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
#app-shell .metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#app-shell .metric{background:var(--bg);border-radius:12px;padding:13px}
#app-shell .metric b{font-size:24px;display:block}
#app-shell .metric small{color:var(--mu)}
#app-shell .advice{border-left:3px solid var(--gd);background:var(--bg);padding:14px;border-radius:0 12px 12px 0;line-height:1.55}
#app-shell .btn-primary{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 16px;font:700 14px system-ui;cursor:pointer}
#app-shell .btn-quiet{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px 14px;font:600 14px system-ui;cursor:pointer}
#app-shell .btn-open-tool{background:var(--ac);color:var(--on);border:1px solid var(--ac);border-radius:10px;padding:11px 14px;font:700 14px system-ui;cursor:pointer;transition:filter .15s ease,transform .15s ease}
#app-shell .btn-open-tool:hover{filter:brightness(1.08);transform:translateY(-1px)}
#app-shell .btn-open-tool:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
#app-shell .onboard{max-width:760px;margin:5vh auto;padding:30px;background:var(--cd);border:1px solid var(--bd);border-radius:20px}
#app-shell .onboard h1{border:0;padding:0;font-size:32px;margin:10px 0}
#app-shell .step-dots{display:flex;gap:6px;margin:18px 0}
#app-shell .step-dots i{height:5px;flex:1;border-radius:9px;background:var(--bd)}
#app-shell .step-dots i.on{background:var(--gd)}
#app-shell .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0}
#app-shell .choice{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:14px;border-radius:12px;text-align:left;cursor:pointer;font:600 14px system-ui;min-height:64px}
#app-shell .choice.selected{border:2px solid var(--gd);padding:13px;background:color-mix(in srgb,var(--gd) 9%,var(--cd))}
#app-shell input,#app-shell select,#app-shell textarea{max-width:100%}
#app-shell .module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
#app-shell .module-card{padding:16px;border:1px solid var(--bd);border-radius:14px;background:var(--cd);cursor:pointer;text-align:left;color:var(--tx)}
#app-shell .module-card b{display:block;margin:6px 0}
#app-shell .module-card small{color:var(--mu)}
#app-shell .tag{display:inline-flex;padding:4px 8px;border-radius:99px;background:var(--bg);color:var(--mu);font-size:11px;font-weight:700}
#app-shell .empty-state{padding:24px;text-align:center;color:var(--mu)}
#app-shell .review-item{padding:12px 0;border-top:1px solid var(--bd)}
#app-shell .review-item:first-of-type{border-top:0}
#app-shell .form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
@media(max-width:800px){#app-shell{padding:16px 14px 35px}.grid-main{grid-template-columns:1fr}.hero{padding:21px}.shell-nav{overflow-x:auto;flex-wrap:nowrap}.shell-nav button{white-space:nowrap}}
@media(max-width:480px){#app-shell .choice-grid{grid-template-columns:1fr}.metric-row{grid-template-columns:repeat(3,1fr)}#app-shell .metric{padding:10px}#app-shell .metric b{font-size:20px}.priority{align-items:flex-start!important;flex-wrap:wrap}.priority .check-btn{margin-left:52px}}
